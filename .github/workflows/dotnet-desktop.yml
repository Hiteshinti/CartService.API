name: Build .NET 8

on:
  push:
    branches:
      - main
    

  pull_request:
    branches:
      - main
    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore CartService.sln

      - name: Build Solution
        run: dotnet build CartService.sln --configuration Release --no-restore
