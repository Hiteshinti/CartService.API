services:
 cartservice.api:
    container_name: cartservice.api
    build:
      context: .
      dockerfile: CartService.API/Dockerfile
    image: cartserviceapp:latest
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:9090
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
        - "9090:9090" 
    networks:
      - ocelot-shared-network

networks:
  ocelot-shared-network:
    external: true